# Publishes gleap_sdk to pub.dev when a version tag (e.g. 18.2.0) is pushed.
#
# Authentication uses pub.dev automated publishing (GitHub OIDC): no stored
# token. One-time setup on pub.dev → gleap_sdk → Admin → Automated publishing:
# enable GitHub Actions, repository GleapSDK/Flutter-SDK, tag pattern {{version}}.
# See CONTRIBUTING.md → Releasing.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Flutter version the release checks were verified with; bump deliberately.
  FLUTTER_VERSION: '3.41.4'

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev OIDC token
    steps:
      - uses: actions/checkout@v6

      # Provisions the pub.dev OIDC token (dart pub token add … --env-var PUB_TOKEN).
      # Its `dart` is shadowed by the Flutter SDK installed next, which is the
      # order dart-lang/setup-dart's own publish workflow uses.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify tag matches pubspec.yaml version
        run: |
          PUBSPEC_VERSION="$(awk '/^version:/ { print $2 }' pubspec.yaml | tr -d "\"'\r")"
          echo "tag=${GITHUB_REF_NAME} pubspec=${PUBSPEC_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${PUBSPEC_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${PUBSPEC_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      # Infos (avoid_print in example/) are pre-existing; warnings and errors still fail.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Publish (dry run)
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        run: flutter pub publish --force

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          # Section "## <version>" up to the next "## " heading.
          awk -v v="$TAG" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          args=(--title "$TAG" --verify-tag)
          if [ -s release-notes.md ]; then
            args+=(--notes-file release-notes.md)
          else
            echo "::warning::No CHANGELOG.md section for $TAG, using generated notes."
            args+=(--generate-notes)
          fi
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}"
